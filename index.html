@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b:#8db6ff;--lb:#1a2a47;--bg:#0e1522;--card:#152033;--tx:#eaf0fb;--mu:#a3b0c7;--ok:#5fd18a;--wr:#ff8f85;--ln:#2a3a58}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.8 Tajawal,"Segoe UI",Tahoma,sans-serif;padding-bottom:84px}
main{max-width:860px;margin:auto;padding:16px}
h1{font-size:26px;margin:.2em 0}h2{font-size:21px;margin:1em 0 .4em}h3{font-size:18px;margin:.8em 0 .2em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.hero{background:var(--b);color:#fff;border-radius:16px;padding:22px}
.hero p{margin:.2em 0;opacity:.95}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:2px solid var(--b);background:var(--card);color:var(--b);padding:8px 16px;font-weight:700}
button.p{background:var(--b);color:#fff}button.w{border-color:#fff;background:#fff;color:#0b3d91}
:root[data-theme="dark"] button.p{color:#0e1522}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px}
input[type=search]{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--ln);padding:8px 14px;font:inherit;background:var(--card);color:var(--tx)}
.bar{height:12px;background:var(--lb);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:right;margin:6px 0;border-color:var(--ln);color:var(--tx);font-weight:500}
.li b{flex:1}.tag{font-size:14px;color:var(--mu)}.ok{color:var(--ok);font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;min-height:60px;font-size:15px;color:var(--mu)}nav button.on{color:var(--b);background:var(--lb)}
ol{padding-inline-start:24px}li{margin:6px 0}
.seg button{border-radius:0}.seg button.on{background:var(--b);color:#fff}
.warn{border-inline-start:5px solid var(--wr);padding-inline-start:12px}
figure{margin:12px 0}figure svg{width:100%;max-width:520px;height:auto;display:block;margin:auto;background:var(--lb);border-radius:12px}
figcaption{font-size:14px;color:var(--mu);text-align:center}
.opt{display:block;width:100%;text-align:right;margin:6px 0;font-weight:500;color:var(--tx);border-color:var(--ln)}
.opt.g{border-color:var(--ok);background:var(--lb)}.opt.r{border-color:var(--wr)}
small{color:var(--mu)}
</style></head><body><main id="app"></main>

if(st.tab=='home'){const nx=L.findIndex((_,i)=>!done().includes(i));
h=`<div class="hero"><h1>دليلك لتعلّم Word</h1><p>تعلّم خطوة بخطوة. وتدرّب بنفسك.</p><p><small style="color:#dce8ff">مورد تعليمي مستقل وليس منتجًا رسميًا من Microsoft.</small></p></div>
<h2>اختر مسار التعلّم</h2><div class="row"><button class="p" onclick="pick('m')">📱 مسار الجوال<br><small style="color:inherit">أندرويد وآيفون</small></button><button class="p" onclick="pick('d')">💻 مسار الحاسوب<br><small style="color:inherit">ويندوز وماك</small></button></div>
<div class="card"><b>تقدّمك: ${pc}%</b> (${d} من ${L.length} دروس)<div class="bar" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%"></i></div>${nx>=0?`<p><button class="p" onclick="open_(${nx})">${d?'تابع من حيث توقفت':'ابدأ الدرس الأول'}</button></p>`:'<p class="ok">أتممت جميع الدروس المتاحة 🎉</p>'}</div>`}
else if(st.tab=='list'){const q=st.q.trim();
h=`<h1>الدروس</h1><input type="search" id="sq" placeholder="ابحث عن درس أو موضوع" aria-label="بحث" value="${q.replace(/"/g,'&quot;')}" oninput="st.q=this.value;draw();$('sq').focus();">`;
M.forEach((m,mi)=>{const ids=L.map((l,i)=>i).filter(i=>L[i].m==mi&&(!q||(L[i].t+L[i].obj+m).includes(q)));if(ids.length)h+=`<h2>${mi+1}. ${m}</h2>`+ids.map(item).join('')});
if(!/li/.test(h))h+='<div class="card">لا توجد نتائج. جرّب كلمة أخرى.</div>'}
else if(st.tab=='saved'){const b=bm();h='<h1>المحفوظات ★</h1>'+(b.length?b.map(item).join(''):'<div class="card">لم تحفظ دروسًا بعد. افتح درسًا واضغط «احفظ الدرس».</div>')}
else if(st.tab=='prog'){const r=qz(),ks=Object.keys(r);
h=`<h1>تقدّمي</h1><div class="card"><b>${pc}%</b><div class="bar"><i style="width:${pc}%"></i></div></div><h2>الوحدات</h2>`+M.map((m,mi)=>{const ids=L.map((l,i)=>i).filter(i=>L[i].m==mi);const c=ids.filter(i=>done().includes(i)).length;return `<div class="card">${mi+1}. ${m}<br><span class="${ids.length&&c==ids.length?'ok':'tag'}">${ids.length?`${c} من ${ids.length}${c==ids.length?' ✓ مكتملة':''}`:'قريبًا'}</span></div>`}).join('')+
`<h2>نتائج الاختبارات</h2><div class="card">${ks.length?ks.map(k=>`${L[k].t}: ${r[k]?'<span class="ok">صحيح</span>':'<span style="color:var(--wr)">خطأ</span>'}`).join('<br>'):'لا نتائج بعد.'}</div>
<h2>المقارنة بين الجوال والحاسوب</h2><div class="card">الجوال مناسب للكتابة والتنسيق السريع والمراجعة. الحاسوب أفضل للجداول الكبيرة وجدول المحتويات والدمج البريدي. الميزات ليست متطابقة بين الإصدارين.</div>
<button onclick="rst()">إعادة ضبط التقدم</button>`}
else{const i=st.lid,l=L[i],p=st.plat,steps=p=='m'?l.m_:l.d_,j=qz()[i];
h=`<p><button onclick="go('list')">→ الدروس</button></p><h1>${l.t}</h1><small>${M[l.m]} · ${l.lv} · ${l.min} دقائق</small>
<div class="seg row" role="group" aria-label="المنصة"><button class="${p=='m'?'on':''}" onclick="st.plat='m';S.set('plat','m');draw()">📱 جوال</button><button class="${p=='d'?'on':''}" onclick="st.plat='d';S.set('plat','d');draw()">💻 حاسوب</button></div>
<div class="card"><b>الهدف:</b> ${l.obj}<br><b>التحضير:</b> ${l.pre}</div>
<h2>الخطوات</h2><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>${fig(p,p=='m'?l.mh:l.dh)}
${p=='m'?'<small>على آيفون وأندرويد قد تختلف أماكن الأزرار قليلًا حسب الإصدار.</small>':''}
<div class="card"><b>النتيجة المتوقعة:</b> ${l.res}</div><div class="card warn"><b>أخطاء شائعة:</b> ${l.mis}</div>
<div class="card"><b>تمرين:</b> ${l.ex}<br><small>نفّذه في Word بنفسك؛ لا يفحص التطبيق ملفك.</small>${l.chk?'<ul>'+l.chk.map(c=>`<li>☐ ${c}</li>`).join('')+'</ul>':''}</div>
<div class="card"><b>اختبر نفسك:</b> ${l.q[0]}${l.q[1].map((o,k)=>`<button class="opt ${j!==undefined&&k==l.q[2]?'g':''}" onclick="ans(${i},${k})">${o}</button>`).join('')}${j===undefined?'':`<p class="${j?'ok':''}">${j?'إجابة صحيحة. ':'الإجابة الصحيحة موضّحة بالأخضر. '}${l.q[3]}</p>`}</div>
<p>💡 ${l.tip}</p>
<div class="row"><button class="p" onclick="tog('done',${i})">${done().includes(i)?'✓ مكتمل (إلغاء)':'تحديد كمكتمل'}</button><button onclick="tog('bm',${i})">${bm().includes(i)?'★ محفوظ':'☆ احفظ الدرس'}</button></div>
<div class="row" style="margin-top:10px">${i>0?`<button onclick="open_(${i-1})">→ السابق</button>`:''}${i<L.length-1?`<button onclick="open_(${i+1})">التالي ←</button>`:''}</div>`}
$('app').innerHTML=h;
const T=[['home','🏠','الرئيسية'],['list','📚','الدروس'],['saved','★','المحفوظات'],['prog','📈','تقدّمي']];
$('nav').innerHTML=T.map(t=>`<button class="${st.tab==t[0]||(st.tab=='lesson'&&t[0]=='list')?'on':''}" onclick="go('${t[0]}')" aria-label="${t[2]}">${t[1]}<br>${t[2]}</button>`).join('')}
draw();
</script></body></html>
